{% extends "base.html" %}
{% block title %}Mutfak paneli{% endblock %}
{% block meta %}<meta name="robots" content="noindex">{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block body %}
<main class="login">
  <form class="ticket login-ticket" method="post">
    <header class="ticket-head"><span>mutfak paneli</span></header>
    <h1>Panele giriş</h1>
    <label for="password">Şifre</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <button class="button primary" type="submit">Giriş yap</button>
  </form>
</main>
{% endblock %}
